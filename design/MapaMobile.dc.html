<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  state = { art: null };
  rainRef = React.createRef();
  componentDidMount() {
    this._t = setInterval(() => {
      if (window.PX) { clearInterval(this._t); this.setState({ art: window.PX.get() }, () => { this._stop = window.PX.live(this.rainRef.current || document.querySelector('canvas[data-live="mapam"]'), { src: 'assets/mapa-cidade.png' }); }); }
    }, 30);
  }
  componentWillUnmount() { clearInterval(this._t); this._stop && this._stop(); }
  renderVals() {
    return { A: this.state.art || { icons: {}, mk: {}, pt: {}, mini: {} } };
  }
}
</script>
